name: ResearchMinds tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU-friendly test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy faiss-cpu PyMuPDF streamlit langchain-core langchain-text-splitters langchain-groq langchain-ollama pytest pytest-cov

      - name: Run offline unit tests
        env:
          PYTHONPATH: .
        run: pytest -v --cov=src --cov-report=term-missing
